name: codeql

on:
  schedule:
    - cron: "27 3 * * 1"  # weekly, Monday 03:27 UTC
  workflow_call: {}

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write  # required to upload CodeQL results
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: python
          # security-extended keeps full security coverage without the quality/style
          # rules already enforced by ruff + mypy strict (reduces advisory noise).
          queries: security-extended
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
