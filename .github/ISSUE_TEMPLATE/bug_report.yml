name: Bug Report
description: Report a bug or unexpected behavior
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug.

        **If this is a security issue, stop here** and use a private advisory
        instead: https://github.com/rmednitzer/aiops-mcp/security/advisories/new

        Anything that weakens one of the nine invariants (audited execution
        path, tiered authority, audit chain integrity, bitemporal facts,
        host_type gating, the approval gate, transport posture, trifecta
        containment, least privilege) counts as a security issue.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Step by step instructions to reproduce the issue.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which layer does this sit in?
      options:
        - State model (bitemporal facts, store)
        - Drift engine
        - Actuation and approval flow
        - Audit and redaction
        - Governance and tier classification
        - Transport (stdio, HTTP, SSRF filter)
        - Collectors
        - Skills
        - Packaging, CI, or docs
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode in use
      options:
        - readonly
        - guarded
        - open
        - Not applicable
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: >-
        Relevant versions (OS, Python, praxis commit SHA), the transport in use
        (stdio or HTTP), and the store backend (in-memory or Postgres).
      render: shell
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: >-
        Logs or audit records. Redact tokens, hostnames, and any output body
        before pasting.
    validations:
      required: false
