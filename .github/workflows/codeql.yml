name: codeql

on:
  schedule:
    - cron: "27 3 * * 1"  # weekly, Monday 03:27 UTC
  workflow_call: {}

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write  # required to upload CodeQL results
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Initialize CodeQL
        uses: github/codeql-action/init@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          languages: python
          # security-extended keeps full security coverage without the quality/style
          # rules already enforced by ruff + mypy strict (reduces advisory noise).
          queries: security-extended
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
